# Basic team information shown on every page.
# Reviewers (S-W1) look for: team name, affiliation, PI / team leader / contact, robot.
# Leave a value empty ("") until it is decided; empty items are not shown.
- id: main
  team_name: TRAIL Club
  # 検索エンジンに載せない（未完成の間）。内容が揃ったら false にする。
  noindex: true
  league: RoboCup@Home Open Platform League (OPL)
  robot_name: AhaRobot
  affiliation: ""            # TODO: university / lab (English)
  affiliation_ja: ""         # TODO: 所属（日本語）
  affiliation_url: ""
  tagline: ""                # one sentence for the general public (English)
  tagline_ja: ""             # 一般向けの一文（日本語）
  contact_email: ""          # TODO: contact address shown on the Contact page
  github: https://github.com/trail-club
  youtube: ""
  x: ""
  instagram: ""
  # H-G1 (pass/fail): a photo of most team members with the fully assembled
  # robot, taken in the current qualification year. Put the file in public/images/.
  team_photo: ""             # e.g. /images/team-2026.jpg
  team_photo_year:           # e.g. 2026
  team_photo_caption: ""
  team_photo_caption_ja: ""
  robot_photo: ""            # photo of the real, fully assembled robot, e.g. /images/aharobot.jpg
  qualification_video: ""    # YouTube video id, e.g. dQw4w9WgXcQ
  # Brand assets: generated by design/logo/scripts/run.sh (see README「ロゴ」).
  logo: /brand/logo.svg     # header logo (horizontal)
  logo_dark: /brand/logo-dark.svg
  favicon: /brand/favicon.svg
  apple_touch_icon: /brand/apple-touch-icon.png
  og_image: /brand/og.png    # 1200x630 PNG shown when the site is shared
